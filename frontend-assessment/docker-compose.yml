services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: http://backend:4000
    depends_on:
      - backend

volumes:
  backend-data:
